name: 🖥️ Build Windows x64 EXE & Linux Desktop Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Standalone Executables (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: "Windows-x64-Setup"
          - os: ubuntu-latest
            artifact_name: "Linux-x64-AppImage"

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Application Web & Server Assets
        run: npm run build

      - name: ⚡ Install Electron & Builder CLI
        run: npm install --save-dev electron electron-builder

      - name: 🚀 Compile Windows x64 Standalone Executable (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --x64

      - name: 🚀 Compile Linux x64 Standalone Executable (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --x64

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: 🏷️ Release to GitHub Releases (On Tag or Workflow Dispatch)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

